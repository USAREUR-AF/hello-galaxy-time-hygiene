name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Both Ed25519 backends must give the same answers.
        crypto: ["with-cryptography", "pure-python"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: install cryptography
        if: matrix.crypto == 'with-cryptography'
        run: pip install -r requirements.txt
      - name: reference vs production-signed vectors
        run: python3 tests/verify_vectors.py
      - name: the five offline scenarios
        run: bin/hello-time offline
